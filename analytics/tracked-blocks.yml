- block_id: ''
  heading: 'Case study: The Matrix in *Shared Reality Cosm*, an experiential media
    company that opened its first flagship venues in Los Angeles and Dallas in 2023–24,
    uses giant 87-foot LED domes with spatial audio to deliver what it calls ***Shared
    Reality*** experiences, blending cinema, live events and immersive environments.
    *Cosm''s **Shared Reality*** adaptation of*** The Matrix*** premiered June 2025
    as a collaboration between *Cosm*,* Warner Bros. *and* Little Cinema*. The movie
    is shown in its original 16:9 frame, while the surrounding dome expands the world
    outward with, for example, office interiors continuing beyond the screen, bullets
    fly out of the frame, and during a helicopter rescue the skyline ripples and tilts
    in sync with the action. 1 min'
  topic: ''
  concept: ''
  content_type: section
  label: ''
