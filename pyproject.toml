[project]
name = "multisensory-hub"
version = "0.1.0"
description = "Multisensory Hub build pipeline and analytics"
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.2.0",
    "msal>=1.35.0",
    "requests>=2.32.5",
    "colorama>=0.4.6",
    "pyyaml>=6.0.1",
]

[tool.setuptools]
packages = []

[tool.uv]
managed = true
workspace = { members = ["multisensoryHubHeatMap"] }

[tool.uv.sources]
concept-analytics = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.12.0",
    "django>=6.0.5",
    "django-cors-headers>=4.9.0",
]
